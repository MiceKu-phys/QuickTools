<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ramping field · AMI-style field plan</title>
<style>
:root{--paper:#f8f4e9;--card:#fdfbf4;--ink:#30302c;--muted:#817b6d;--line:#e5dece;--rule:#cec5b0;--accent:#5b7184;--code:#405363;--out:#f0ebdf;--fill:rgba(91,113,132,.22)}
html[data-theme=dark]{--paper:#1b1914;--card:#242119;--ink:#e7e0d0;--muted:#a29a8b;--line:#40392c;--rule:#5d543f;--accent:#a1b8ca;--code:#d4dee6;--out:#2c271d;--fill:rgba(161,184,202,.22)}
*{box-sizing:border-box}body{margin:0;padding:30px 18px 60px;background:var(--paper);color:var(--ink);font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}main{max-width:920px;margin:auto}header{display:flex;gap:14px;align-items:flex-start;margin-bottom:20px}.title{flex:1}.title h1{font:500 26px Georgia,"Songti SC",serif;margin:0 0 4px}.sub{color:var(--muted);font-size:13px}.theme{background:none;border:1px solid var(--line);color:var(--muted);padding:5px 10px;cursor:pointer}.card{background:var(--card);border:1px solid var(--line);padding:20px 24px;margin:0 0 16px}.card h2{font:500 17px Georgia,"Songti SC",serif;margin:0 0 13px;border-bottom:1px solid var(--line);padding-bottom:8px}.table-wrap{overflow:auto}.plan{width:100%;border-collapse:collapse;min-width:650px}.plan th,.plan td{text-align:left;border-bottom:1px solid var(--line);padding:8px 7px;vertical-align:middle}.plan th{color:var(--muted);font-size:12px;font-weight:500}.plan td:first-child,.plan th:first-child{width:65px}.plan input{width:100%;min-width:105px;padding:7px 8px;border:1px solid var(--rule);background:transparent;color:var(--code);font:14px Consolas,monospace}.plan input:focus,.target input:focus{outline:none;border-color:var(--accent);box-shadow:0 1px 0 var(--accent)}.plan input[readonly]{background:var(--out);color:var(--muted);border-color:var(--line)}.unit{color:var(--muted);font-size:12px;white-space:nowrap}.duration{color:var(--muted);font:13px Consolas,monospace;white-space:nowrap}.row-actions{display:flex;gap:6px;justify-content:flex-end}.small{padding:5px 8px;border:1px solid var(--rule);background:transparent;color:var(--muted);cursor:pointer}.small:hover,.action:hover{border-color:var(--accent);color:var(--accent)}.action{padding:7px 13px;border:1px solid var(--rule);background:transparent;color:var(--ink);cursor:pointer}.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:14px}.hint,.note{font-size:12px;color:var(--muted);margin-top:10px}.note.err{color:#a1462f}.target{display:grid;grid-template-columns:minmax(220px,1fr) minmax(220px,1fr);gap:16px;align-items:end}.target label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.target input{width:100%;padding:10px;border:1px solid var(--rule);background:transparent;color:var(--code);font:17px Consolas,monospace}.target .answer{background:var(--out);padding:9px 11px;min-height:44px;color:var(--code);font:16px Consolas,monospace;border-left:2px solid var(--accent)}.target .answer small{display:block;color:var(--muted);font:12px "Segoe UI","Microsoft YaHei",sans-serif}.chart-wrap{border:1px solid var(--line);background:color-mix(in srgb,var(--paper) 38%,transparent);padding:8px 4px 3px;overflow:auto}.chart{display:block;width:100%;min-width:700px;height:auto}.axis{stroke:var(--rule);stroke-width:1}.gridline{stroke:var(--line);stroke-width:1}.line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}.area{fill:var(--fill)}.chart text{fill:var(--muted);font:11px "Segoe UI","Microsoft YaHei",sans-serif}.chart .seglabel{fill:var(--code);font-size:11px}.legend{display:flex;flex-wrap:wrap;gap:12px 18px;margin-top:7px;color:var(--muted);font-size:12px}.legend i{display:inline-block;width:18px;border-top:2px solid var(--accent);vertical-align:middle;margin-right:4px}footer{text-align:center;color:var(--muted);font:12px Georgia,serif;margin-top:18px}@media(max-width:600px){body{padding:20px 11px 40px}.card{padding:17px 14px}.title h1{font-size:22px}.target{grid-template-columns:1fr}}
</style>
<style>
.field-line{fill:none;stroke:var(--code);stroke-width:2.5;stroke-linejoin:round}.field-dot{fill:var(--card);stroke:var(--code);stroke-width:2}.time-line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}.time-dot{fill:var(--card);stroke:var(--accent);stroke-width:2}.legend i{border-color:var(--accent)}.legend i.speed-key{border-color:var(--code)}.target{grid-template-columns:repeat(3,minmax(170px,1fr))}@media(max-width:600px){.target{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<header><div class="title"><h1>磁场爬升计划</h1><div class="sub">Ramping field · AMI-style segmented field control</div></div><button class="theme" id="themeBtn">☼ 夜纸</button></header>

<section class="card"><h2>分段计划</h2><div class="table-wrap"><table class="plan"><thead><tr><th>段</th><th>开始磁场</th><th>结束磁场</th><th>速度</th><th>本段时间</th><th>结束到达时间</th><th></th></tr></thead><tbody id="planBody"></tbody></table></div><div class="bar"><button class="action" id="addBtn">＋ 添加分段</button><button class="action" id="resetBtn">恢复默认</button></div><div class="hint">第一段固定从 0 T 开始；之后每段自动从上一段的结束值开始。速度为正值，磁场可以上升或下降，时间按磁场差的绝对值计算。</div><div class="note" id="planNote"></div></section>

<section class="card"><h2>时间计算</h2><div class="target"><div><label for="startInput">起始磁场</label><input id="startInput" type="text" inputmode="decimal" value="0" placeholder="例如 0"></div><div><label for="endInput">终止磁场</label><input id="endInput" type="text" inputmode="decimal" value="14" placeholder="例如 14"></div><div><label>按计划计算的区间时间</label><div class="answer" id="timeAnswer"><small>请输入计划范围内的起止磁场</small>—</div></div></div><div class="note" id="targetNote"></div></section>

<section class="card"><h2>磁场—时间与速度—磁场图</h2><div class="chart-wrap"><svg class="chart" id="chart" viewBox="0 0 820 390" role="img" aria-label="磁场时间折线与速度磁场图"></svg></div><div class="legend"><span><i></i>速度（T/min）</span><span><i class="speed-key"></i>从 0 T 起累计时间（min）</span><span>速度下方的半透明区域表示各磁场段</span></div></section>
<footer>时间单位：min　·　磁场单位：T　·　速度单位：T/min</footer>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const DEFAULTS=[{end:1.5,speed:0.08},{end:8,speed:0.1},{end:14,speed:0.02}];
let segments=DEFAULTS.map(x=>({...x}));
function num(v){const n=Number(v);return Number.isFinite(n)?n:NaN}
function fmt(v,d=3){if(!Number.isFinite(v))return '—';return Number(v.toFixed(d)).toString()}
function duration(seg){return Math.abs(seg.end-seg.start)/seg.speed}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function buildData(){let start=0,total=0,ok=true,problem='';const data=[];segments.forEach((seg,i)=>{seg.start=start;const end=num(seg.end),speed=num(seg.speed);if(!Number.isFinite(end)){ok=false;problem=`第 ${i+1} 段的结束磁场无效。`}if(!Number.isFinite(speed)||speed<=0){ok=false;problem=`第 ${i+1} 段的速度必须大于 0。`}const clean={index:i,start,end,speed,time:Number.isFinite(end)&&Number.isFinite(speed)&&speed>0?Math.abs(end-start)/speed:NaN,t0:total};if(Number.isFinite(clean.time))total+=clean.time;clean.t1=total;data.push(clean);start=end});return {data,total,ok,problem}}
function renderTable(){const data=buildData().data;$('planBody').innerHTML=data.map((seg,i)=>`<tr><td>第 ${i+1} 段</td><td><input class="startValue" value="${i===0?'0':fmt(seg.start)}" readonly aria-label="第 ${i+1} 段开始磁场"><span class="unit">T</span></td><td><input class="endInput" data-index="${i}" type="text" inputmode="decimal" value="${Number.isFinite(seg.end)?escapeHtml(seg.end):''}" aria-label="第 ${i+1} 段结束磁场"><span class="unit">T</span></td><td><input class="speedInput" data-index="${i}" type="text" inputmode="decimal" value="${Number.isFinite(seg.speed)?escapeHtml(seg.speed):''}" aria-label="第 ${i+1} 段速度"><span class="unit">T/min</span></td><td class="duration">${Number.isFinite(seg.time)?fmt(seg.time,2)+' min':'—'}</td><td class="arrival">${Number.isFinite(seg.t1)?formatTime(seg.t1):'—'}</td><td><div class="row-actions">${segments.length>1?`<button class="small removeBtn" data-index="${i}" type="button" title="删除此段">×</button>`:''}</div></td></tr>`).join('');document.querySelectorAll('.endInput').forEach(el=>el.addEventListener('input',()=>{segments[Number(el.dataset.index)].end=el.value;refresh(false)}));document.querySelectorAll('.speedInput').forEach(el=>el.addEventListener('input',()=>{segments[Number(el.dataset.index)].speed=el.value;refresh(false)}));document.querySelectorAll('.removeBtn').forEach(el=>el.addEventListener('click',()=>{segments.splice(Number(el.dataset.index),1);refresh()}))}
function updatePlanValues(data){data.forEach((seg,i)=>{const row=$('planBody').rows[i];if(!row)return;row.querySelector('.startValue').value=i===0?'0':fmt(seg.start);row.querySelector('.duration').textContent=Number.isFinite(seg.time)?fmt(seg.time,2)+' min':'—';row.querySelector('.arrival').textContent=Number.isFinite(seg.t1)?formatTime(seg.t1):'—'})}
function formatTime(min){if(!Number.isFinite(min))return '—';const h=Math.floor(min/60),m=Math.floor(min%60),s=Math.round((min-Math.floor(min))*60);if(h)return `${h} h ${m} min`;if(m)return `${m} min ${s? s+' s':''}`.trim();return `${s} s`}
function timeAtField(target,result){for(const seg of result.data){const lo=Math.min(seg.start,seg.end),hi=Math.max(seg.start,seg.end);if(target>=lo-1e-12&&target<=hi+1e-12)return seg.t0+Math.abs(target-seg.start)/seg.speed}return NaN}
function renderTarget(result){const start=num($('startInput').value),end=num($('endInput').value),note=$('targetNote'),answer=$('timeAnswer');if(!result.ok){answer.innerHTML='<small>请先修正分段计划</small>—';note.textContent=result.problem;note.className='note err';return}const tStart=timeAtField(start,result),tEnd=timeAtField(end,result);if(!Number.isFinite(start)||!Number.isFinite(end)){answer.innerHTML='<small>请输入有效的起止磁场</small>—';note.textContent='';note.className='note';return}if(!Number.isFinite(tStart)||!Number.isFinite(tEnd)){answer.innerHTML='<small>磁场超出当前分段计划范围</small>—';note.textContent=`当前计划覆盖 ${fmt(Math.min(...result.data.map(x=>x.start).concat(result.data.map(x=>x.end))))} 至 ${fmt(Math.max(...result.data.map(x=>x.start).concat(result.data.map(x=>x.end))))} T。`;note.className='note err';return}const delta=Math.abs(tEnd-tStart);answer.innerHTML=`${formatTime(delta)}<small>${fmt(tStart,2)} → ${fmt(tEnd,2)} min（从 0 T 起）</small>`;note.textContent=`起点 ${fmt(start)} T：${formatTime(tStart)}；终点 ${fmt(end)} T：${formatTime(tEnd)}。`;note.className='note'}
function svgEl(tag,attrs){return `<${tag} ${Object.entries(attrs).map(([k,v])=>`${k}="${v}"`).join(' ')}/>`}
function renderChart(result){const svg=$('chart'),W=820,H=390,left=66,right=66,top=24,bottom=54,iw=W-left-right,ih=H-top-bottom;svg.innerHTML='';if(!result.data.length)return;const fieldValues=result.data.flatMap(x=>[x.start,x.end]).filter(Number.isFinite),minB=Math.min(...fieldValues,0),maxB=Math.max(...fieldValues,1),bRange=Math.max(maxB-minB,0.01),maxV=Math.max(...result.data.map(x=>x.speed).filter(Number.isFinite),0.01),minV=0,vRange=Math.max(maxV-minV,0.01),maxT=Math.max(result.total,1);const x=b=>left+(b-minB)/bRange*iw,yV=v=>top+(maxV-v)/vRange*ih,yT=t=>top+(maxT-t)/maxT*ih;let markup='';for(let i=0;i<=4;i++){const b=minB+(maxB-minB)*i/4,v=minV+(maxV-minV)*i/4,t=maxT*i/4;markup+=svgEl('line',{x1:x(b),y1:top,x2:x(b),y2:H-bottom,class:'gridline'});markup+=`<text x="${x(b)}" y="${H-bottom+19}" text-anchor="middle">${fmt(b,2)}</text>`;markup+=`<text x="${left-9}" y="${yV(v)+4}" text-anchor="end">${fmt(v,2)}</text>`;markup+=`<text x="${W-right+9}" y="${yT(t)+4}">${fmt(t,1)}</text>`}markup+=svgEl('line',{x1:left,y1:top,x2:left,y2:H-bottom,class:'axis'});markup+=svgEl('line',{x1:W-right,y1:top,x2:W-right,y2:H-bottom,class:'axis'});markup+=svgEl('line',{x1:left,y1:H-bottom,x2:W-right,y2:H-bottom,class:'axis'});result.data.forEach((seg,i)=>{if(!Number.isFinite(seg.time))return;const x0=x(seg.start),x1=x(seg.end),v=seg.speed;markup+=`<path class="area" d="M ${x0} ${yV(0)} L ${x0} ${yV(v)} L ${x1} ${yV(v)} L ${x1} ${yV(0)} Z"/>`;markup+=`<path class="line" d="M ${x0} ${yV(v)} L ${x1} ${yV(v)}"/>`;markup+=`<text class="seglabel" x="${(x0+x1)/2}" y="${yV(v)-7}" text-anchor="middle">第 ${i+1} 段</text>`});const timePoints=[`${x(result.data[0].start)},${yT(0)}`,...result.data.map(seg=>`${x(seg.end)},${yT(seg.t1)}`)].join(' ');markup+=`<polyline class="time-line" points="${timePoints}"/>`;result.data.forEach(seg=>{if(Number.isFinite(seg.end)&&Number.isFinite(seg.t1))markup+=`<circle class="time-dot" cx="${x(seg.end)}" cy="${yT(seg.t1)}" r="4"/><text class="seglabel" x="${x(seg.end)}" y="${yT(seg.t1)-8}" text-anchor="middle">${fmt(seg.t1,1)} min</text>`});markup+=`<text x="${(left+W-right)/2}" y="${H-10}" text-anchor="middle">磁场 B（T）</text><text x="15" y="${top+ih/2}" transform="rotate(-90 15 ${top+ih/2})" text-anchor="middle">速度（T/min）</text><text x="${W-15}" y="${top+ih/2}" transform="rotate(90 ${W-15} ${top+ih/2})" text-anchor="middle">从 0 T 起累计时间（min）</text>`;svg.innerHTML=markup}
function refresh(rebuildPlan=true){const result=buildData();if(rebuildPlan)renderTable();else updatePlanValues(result.data);$('planNote').textContent=result.ok?`总用时：${formatTime(result.total)} · 最终磁场：${fmt(result.data.at(-1).end)} T`:result.problem;$('planNote').className='note'+(result.ok?'':' err');renderTarget(result);renderChart(result)}
$('addBtn').onclick=()=>{const last=segments.at(-1);segments.push({end:num(last.end)+1,speed:num(last.speed)||0.1});refresh()};$('resetBtn').onclick=()=>{segments=DEFAULTS.map(x=>({...x}));$('startInput').value=0;$('endInput').value=14;refresh()};['startInput','endInput'].forEach(id=>$(id).addEventListener('input',()=>renderTarget(buildData())));$('themeBtn').onclick=()=>{const dark=document.documentElement.getAttribute('data-theme')==='dark';document.documentElement.setAttribute('data-theme',dark?'':'dark');$('themeBtn').textContent=dark?'☼ 夜纸':'☀ 纸白'};refresh();
</script></body></html>
